title: Ailya Shah
tagline: "Physics · Psyche · Python"
description: Data science, machine learning, and notes on building things.
lang: en

# --- Deployment ---
# These match a project site published at https://<user>.github.io/3P/
# If you rename the repo or use a custom domain, update both lines.
url: "https://ailya-shah.github.io"
baseurl: "/3P"

author:
  name: Ailya Shah
  email: hello@example.com   # swap for your real address

# --- Build ---
markdown: kramdown
highlighter: rouge
permalink: date          # /:year/:month/:day/:title.html  (keeps existing URLs)
timezone: Asia/Karachi

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Primary navigation (rendered in the header) ---
nav:
  - name: Home
    url: /
  - name: Writing
    url: /blog/
  - name: Projects
    url: /projects/
  - name: About
    url: /about/
  - name: Contact
    url: /contact/

# --- Social / profile links (footer + contact page) ---
social:
  - name: GitHub
    url: https://github.com/Ailya-Shah
  - name: LinkedIn
    url: https://www.linkedin.com/in/ailya-shah-52381a320
  - name: Kaggle
    url: https://www.kaggle.com/ailyazainab
  - name: Substack
    url: https://substack.com/@ailyaa

# SEO tag author/twitter (optional)
twitter:
  card: summary_large_image

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - .jekyll-cache
